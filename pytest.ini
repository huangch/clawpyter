# ClawPyter pytest config.
#
# Hermes-only Python suite today; (future) TypeScript vitest suite for the
# OpenClaw plugin lives elsewhere. Run from the repo root::
#
#     pytest hermes_plugin/tests
#
# Note: the test directory is invoked via the ``hermes_plugin`` symlink that
# points at ``hermes-plugin/``. Python can't import a directory whose name has
# a dash — only the symlinked ``hermes_plugin`` path is the canonical Python
# entry. The dashed path is reserved for shell usage only.
[pytest]
testpaths =
    hermes_plugin/tests
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
# Make `from hermes_plugin.tests.conftest import run` work.
pythonpath =
    .
    hermes_plugin/tests
# Hermes tests are sync — they run the async handler under `asyncio.run`
# via the `run()` helper in conftest.py. We do NOT depend on pytest-asyncio
# (which isn't in the conda-setup -d dev dep list).
addopts =
    -ra
    --strict-markers
    --no-header
